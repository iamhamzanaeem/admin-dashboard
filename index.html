<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - An Project by The Odin Project</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="admin-dashboard">
        <div class="sidebar">
            <div class="logo">
                <img src="images & icons/logo.png" alt="logo" />
            </div>
            <div class="main-nav">
                <ul class="main-links">
                    <li>
                        <img src="images & icons/home-icon.svg" alt="home-icon">
                        <span>Home</span>
                    </li>
                    <li>
                        <img src="images & icons/profile-icon.svg" alt="profile-icon">
                        <span>Profile</span>
                    </li>
                    <li>
                        <img src="images & icons/msg-icon.svg" alt="msg-icon">
                        <span>Message</span>
                    </li>
                    <li>
                        <img src="images & icons/history-icon.svg" alt="history-icon">
                        <span>History</span>
                    </li>
                    <li>
                        <img src="images & icons/tasks-icon.svg" alt="tasks-icon">
                        <span>Tasks</span>
                    </li>
                    <li>
                        <img src="images & icons/community-icon.svg" alt="community-icon">
                        <span>Communities</span>
                    </li>
                </ul>
            </div>
            <div class="extra-nav">
                <ul class="extra-links">
                    <li>
                        <img src="images & icons/setting-icon.svg" alt="setting-icon" />
                        <span>Settings</span>
                    </li>
                    <li>
                        <img src="images & icons/support-icon.svg" alt="support-icon">
                        <span>Support</span>
                    </li>
                    <li>
                        <img src="images & icons/privacy-icon.svg" alt="privacy-icon">
                        <span>Privacy</span>
                    </li>
                </ul>
            </div>
        </div>
<main>
        <div class="header">
            <div class="search-and-profilename">
                <div class="search">
                    <img src="images & icons/search-icon.svg" alt="search-icon" />
                    <input type="search" name="search" id="search">
                </div>
                <div class="profile-information">
                    <div class="notification">
                        <img src="images & icons/notification-icon.svg" alt="notification-icon">
                    </div>
                    <div class="profile">
                        <img src="images & icons/man.svg" alt="profile-pic">
                        <span>Hamza Naeem</span>
                    </div>
                </div>
            </div>

            <div class="uploads">
                <div class="user">
                    <img src="images & icons/man.svg" alt="profile-pic"/>
                    <div class="welcome">
                    <span>Hi there,</span>
                    <span>Hamza Naeem (@hamzanaeem)</span>
                    </div>
                </div>
                <div class="buttons">
                    <button class="btns">New</button>
                    <button class="btns">Upload</button>
                    <button class="btns">Share</button>
                </div>
            </div>
        </div>

    </main>
</div>
</body>

</html>
