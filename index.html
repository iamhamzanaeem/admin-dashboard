<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - An Project by The Odin Project</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="admin-dashboard">
        <div class="sidebar">
            <div class="logo">
                <img src="images & icons/logo.png" alt="logo" />
            </div>
            <div class="main-nav">
                <ul class="main-links">
                    <li>
                        <img src="images & icons/home-icon.svg" alt="home-icon">
                        <span>Home</span>
                    </li>
                    <li>
                        <img src="images & icons/profile-icon.svg" alt="profile-icon">
                        <span>Profile</span>
                    </li>
                    <li>
                        <img src="images & icons/msg-icon.svg" alt="msg-icon">
                        <span>Message</span>
                    </li>
                    <li>
                        <img src="images & icons/history-icon.svg" alt="history-icon">
                        <span>History</span>
                    </li>
                    <li>
                        <img src="images & icons/tasks-icon.svg" alt="tasks-icon">
                        <span>Tasks</span>
                    </li>
                    <li>
                        <img src="images & icons/community-icon.svg" alt="community-icon">
                        <span>Communities</span>
                    </li>
                </ul>
            </div>
            <div class="extra-nav">
                <ul class="extra-links">
                    <li>
                        <img src="images & icons/setting-icon.svg" alt="setting-icon" />
                        <span>Settings</span>
                    </li>
                    <li>
                        <img src="images & icons/support-icon.svg" alt="support-icon">
                        <span>Support</span>
                    </li>
                    <li>
                        <img src="images & icons/privacy-icon.svg" alt="privacy-icon">
                        <span>Privacy</span>
                    </li>
                </ul>
            </div>
        </div>

    </div>
</body>

</html>
